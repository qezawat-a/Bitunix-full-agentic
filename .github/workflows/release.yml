name: Build Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 36
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools,platforms;android-36,build-tools;36.0.0

      - name: Install Gradle 8.10
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10-bin.zip -o gradle.zip
          unzip -qq gradle.zip
          echo "GRADLE_HOME=$PWD/gradle-8.10" >> $GITHUB_ENV
          echo "$PWD/gradle-8.10/bin" >> $GITHUB_PATH

      - name: Build release APK
        run: gradle :aibt:assembleRelease

      - name: Upload release APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: aibt/build/outputs/apk/release/aibt-release.apk
          retention-days: 30

      - name: Create GitHub Release and upload APK
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.run_number }}
          tag_name: ${{ github.ref_name }}
          files: aibt/build/outputs/apk/release/aibt-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
